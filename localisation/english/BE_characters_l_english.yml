l_english:
ALB_adem_krasniqi: "Adem Krasniqi"
ARC_michael_moderski: "Michael Moderski"
ARC_michael_moderski_desc: "In a world where the clock seems to tick every closer against humanity, where so many are dying to famine, disease, poverty and violence, you would think that the seemingly imminent doom would force everybody to either come to grips with the ramifications, or go mad from the weight of it. ARC CEO Michael Moderski is one of the few who is completely immunized from this psychological phenomena, acting no differently than if he was born at the height of human society just prior to the Great Mistake. Having formed the American Reclamation Corporation from the 2170s to 2180s, through a process of systematically merging privatized District industries, Moderski only has one personal goal for himself - to live well, and to make sure he has to work as little as possible to do so. With him effectively handing control of basically every major company operation to Chief Financial Officer Suzanne Fielding, Moderski is spending most of his time trying to ensure his ludicrously high personal wealth keeps increasing, and to spend it on the handful of luxury items still available to purchase. He is confident that the gravy train will keep rolling into the station for as long as he is CEO of the ARC.\n\n§RHowever, he's about to learn the hard way that overconfidence, coupled with complacency, is a slow and insidious killer...§!"
ARG_grand_council: "The Grand Council"
ARG_grand_council_desc: "Argentina isn't run merely by one person. It is instead led by the Grand Council, where our four factions meet: the Federales, who want more autonomy in local regions, and thus a federalized government; the Montoneros, a guerrilla group in the more rural regions of the country advocating for agrarian socialism; the Argentinists, who are made up of radical members of the military, wishing for a centralized nationalist state; and finally, the Urbanites, who want Nuevos Aires to be the shining beacon of Argentina, dominated by the rich elite. These factions, despite having different ideological views, must coexist for the better. The future of Argentina will be decided by the machinations taking place in these halls."
AST_rhonda_campbell: "Rhonda Campbell"
AST_rhonda_campbell_desc: "Ever since the Dark Days, when Australia’s establishment parties realized that their authority had been practically cemented, laziness and lax governing began creeping onto the parliament floor. The corruption has essentially blended the main competing parties, becoming collectively known as the Federalist establishment. So secure in their power, little changes based on who’s in office.\n\nCampbell’s own father led the Federation once several decades before her. While her father’s status gave Campbell an edge and boost to her political career, it would never find good use when the time came. Having successfully won the 2199 election, the new Prime Minister came to realize how ineffectual the Federal government’s inner workers truly were. Pointless infighting, incompetent management and corrupt dealings made in broad daylight - issues that all ran far deeper than she ever realized. The Federation was a sham of a government. Campbell, educated but inexperienced, caved at the reality of the position she occupied. She was a scapegoat. She was not, as she expected, the head of a great pacific federation, but an object for the puppeteering corporations and blind masses to point a finger at.\n\nCampbell still has some hope that the future holds some true liberty, but only so much can be done when a knife is placed firmly at your backside. But with some masterful navigation of this political minefield and a ripe enough opportunity, Campbell may prove herself to be a new legendary figure in Oceania’s history."
AST_ian_forscyth: "Ian Forscyth"
AST_ian_forscyth_desc: "Forscyth’s entire essence could be condensed into the archetypal Australian man: fierce, brave, and always with good humour. Far below his smiling exterior, however, is an idealist who just wants his old friends and family back. Born and raised around the rural communities of central New South Wales, Forscyth hoped to live a simple pastoral life, singing and sharing classic Australian stories such as Waltzing Matilda and old Australian heroes such as Ned Kelly or Steve Irwin. His soft fondness for Australia would be met with little enthusiasm from newer urban arrivals however.\n\nSeeing Australasia’s future in the world’s past, Forscyth believes the current government is too corrupt and too far gone for reform. More likely the country’s tattered social fabric will unravel into anarchy before the Federalists even begin to formulate a proposal for change.\n\nTo Forscythe, the answer is as simple as it is paradoxical; look to the past, and look to the future. So many solutions call from the far side of the Great Mistake, from a time when ‘a fair go’ was more than a snide comment. A time when mateship forged unbreakable bonds that weathered fire and flood. He claims these old values must be synthesised with the new and coalesced into a radically new system. Nostalgic? Possibly. Audacious? Absolutely. But to be willing to be bold and take chances is an old Australian philosophy, and one that Forscythe stands by unwaveringly."
AST_aunty_sarah: "Aunty Sarah Gurruwiwi"
AST_aunty_sarah_desc: "Sarah Gurruwiwi’s origins are a mystery to everyone, including - as she likes to joke - herself. She remembers little of her birth family, separated from them during the botched evacuation of her town in the Northern Territory.\n\nIntrigued by aboriginal history, upon coming of age Gurruwiwi embarked upon a walkabout - a physical and spiritual journey into the wilderness to mark the transition to adulthood. Conversing with many along the way, she relished in their wisdom and shared in their pain. All around her, the damage inflicted to the land was poisoning its people. And she couldn’t bear to let it go unanswered.\n\nThe Bushrangers weren’t a new group when she joined. Rising the ranks and eventually becoming their spiritual leader, the group came to offer protection and aid to any who would ask in exchange for other services. Utilizing ancient knowledge of the land for farming and disaster preparation, these efforts proved remarkably successful among the downtrodden of Australasian society, spreading to the Pacific Islands. The Bushrangers thus grew into a much broader political movement representing the country’s underclasses and increasingly establishing themselves as a small but firm voice in Australasian politics. But a growing number within the organization question this approach, instead seeking changes to their traditionalist views, with even Aunty’s own sons standing at odds. Aunty Gurruwiwi finds herself struggling to reconcile deep divisions in her beloved movement, all at a time it can ill afford it."
BRA_manuel_velho: "Manuel Velho"
BRA_manuel_velho_desc: "General Manuel Branco Velho had always stood apart from the rest of Brazil's military elite. Where most commissioned officers were the sons of generals and oligarchs, Velho enjoyed no such privilege as the fourth son of a Cuiabá handyman. Like many in the favelas, Velho and his brothers left for the army at a young age in pursuit of a better life.\n\nDuring the Cerrado War, Velho lost all but one of his brothers in the war against the guerillas, yet gained a reputation as a model soldier who never flinched in the face of the enemy. His heroic actions during Operation Navalha caught the attention of his commanding officers, who then acted as his patrons during his rise to the Brazilian High Command during the 2170's.\n\nAn avowed Brazilian nationalist, General Velho was the driving force behind the Coup of 2198 that overthrew President Frederico Watanabe for his connections to the Andean Compact. Declaring a state of emergency soon after, he then focused on restoring the prominence of the Brazilian Armed Forces in preparation for the eventual war with the Compact, claiming them to be both the main threat Brazilian sovereignty and the main obstacle to Brazilian prosperity.\n\nWhile his critics paint Velho as yet another opportunistic dictator, he maintains that he has always been a man who has stopped at nothing in service of his fatherland. Everything that General Velho has done has been in the name of reasserting Brazil's status as a global power by any means necessary."
BRA_rejinaldo_de_alencar: "Rejinaldo de Alencar"
BRA_rejinaldo_de_alencar_desc: "The tyrant lies dead. Not long after the disastrous failure of his war against Andea, Velho, the leader of the Brazilian military junta, was killed in a coup d'etat led by the Novo Tenentes, a group of military officers loyal to the restoration of democracy and the army's reputation. Led by the stern and experienced war hero Rejinaldo de Alencar, the new provisional military government is well-positioned to reclaim what Velho lost in his arrogance: stable, sane, and functional government. However, General de Alencar must also fight against accusations of being just another tyrant, and prove that the Novo Tenentes' rhetoric of democracy and justice is more than just empty words."
LAM_lucio_ximenes: "Lucio Ximenes"
LAM_lucio_ximenes_desc: "It was once said, that the first person who will live 150 years has already been born. There are more than a few who think that Ximenes will hold that title. Born in Brazil during the Great Mistake, Ximenes grew up seeing the consequences of humanity's destruction of the environment first hand. Once he came of age, he took a job in academia, travelling across South America, learning of the continent's rich culture and history. He had hoped that through this scholarship, the solution for mankind's failure could be found. He was wrong. Years of travel and research made him realise that Brazil needed more than philosophers to save the Amazon. That was when he met Eloa Alvarez.\n\nAlvarez grew fond of such an educated man, and brought Ximenes into their "Survivalists" a group of insurgents who sought to preserve the Amazon through action not words. For a time, Ximenes went along with this group and happily helped in their mission. But as the years went on, he began to see Alvarez not as a liberator, but a semi-fascist autocrat. With a heart heavy from the many crimes he had committed, Ximenes deserted the group, taking many like minded followers with him.\n\nXimenes spent the next few decades forming his own Survivalist militia, revealing himself as a gentle man with a kind heart. Many flocked to his side, viewing Ximenes as the best chance for Brazil to save itself. Both culturally and ecologically. Emphasised by his reluctance to use the under handed tactic used by other factions. But now, at over a century old, and a chance to realise his dream for a green Brazil here, it is feared he will not live to see it. The young man that once led entire platoons of soldiers and guerrillas can now only walk with the assistance of a cane. Even the advanced medicine and technology of this era give him a few decades of life at the most. With the Grim Reaper fast approaching, Ximenes plans to use his skills as much as he can. So that when he finally does depart from this world, it will be a better place than when he entered it."
LEG_eloa_alvarez: "Eloa Alvarez"
LEG_eloa_alvarez_desc: "Eloa Alvarez is yet another leader among the many figures of South America, but even among the harsh survivalists of the region, she is notorious for her rigid beliefs, staunch belief in might-makes-right, and a fearsome military.\n\nThe military in question is composed mostly of fellow survivalists- they are drawn to power like moths, and Eloa bears the torch of strength. Even for them her practices are brutal, and this brutality enforces her will over theirs. Survivalists are loyal, but that loyalty is only to power. A sign of weakness, and the warriors may leave to stronger rulers still- or deem themselves stronger instead. Survivalists are both a source of strength, and what tests it. Often, signs of mercy may be a weakness in the eyes of those who find mercy an alien thing, and there will be time for mercy once the work is done.\n\nHer history is usually kept private- she sees no reason to share it- but it is generally understood she grew up among the lower classes along the northern outskirts of Brazil, the tumultuous border regions of her country. Raiders, bandits, and survivalists often raided her home, making each day a question of life and death. Her father was the only notable figure in her life, an old soldier who fought in a forgotten war. Despite his efforts, his beliefs contrasted with what Eloa saw- and she saw violence.\n\nViolence breeds violence, and the womb of war bred something far worse than petty thieves and lost warriors robbing families- it bore Alvarez, and at her command was all the horrors her army could muster.\n\nShe was borne by the sword, and was forced to live by it, and now she must ensure no other weapon may pose a threat to her people, her people of many blades."
GRP_frederico_watanabe: "Frederico Watanabe"
GRP_frederico_watanabe_desc: "Frederico Watanabe was the President of a free and prosperous Brazil before the vile Velho overthrew the rightful government and instituted a kleptocratic military dictatorship. After the coup, President Watanabe and his supporters fled to the Andean Compact, the bastion of South American democracy, to lead a government in exile. Ultimately, however, Velho's downfall was brought about by his own piggy arrogance. After the tyrant's failed invasion of the Compact, the rightful President Watanabe has finally made his glorious return. With Andean support and volunteers from around the world, the forces of the old republic have returned to put down upstarts, tyrants, and radicals, and to restore freedom and democracy to Brazil and right the wrongs of the past years."
BUL_georgios_karamanlis: "Georgios Karamanlis"
CAL_corazon_santiago: "Corazon Santiago"
CAL_corazon_santiago_desc: "Corazon Santiago was born in District 1 in 2159 to a family of pirates from Puerto Rico. When she was still quite young, her family fled to Central, where she was orphaned during the riots of 2165. Despite her age, she took her younger siblings and joined a survivalist street gang known as the Jade Falcons. She somehow survived the experience, although when she later reappeared in District 1, her siblings had vanished. Santiago never speaks of them, and their fate is unknown.\n\nIn old California, Santiago served as part of a settlement security force (the Red Panthers) and then joined the City Guard of Wayward Harbor, one of the largest villages in the District. She distinguished herself as a battalion commander when the city was attacked by a warlord. This service won her much fame, setting her on a path to found the Spartanists, a selective order of survivalists who stake out a living in old California by destroying bandit hideouts and collecting protection tribute from settlements.\n\nExcellent discipline, physical agility and ability to thrive in any environment led to her being regarded as an exceptional leader. Santiago has a powerful will and practices intense self-discipline. She is adaptable, aggressive, proud, and extremely tenacious. Her personality is one of icy self-control over volcanic rage, the result of her tormented childhood. She will stop at nothing to ensure her own survival and that of her followers. In the end, she has every intention of making herself the absolute ruler of old America."
CAM_iev_boreikhan: "Iev Boreikhan"
CAS_haven_barnett: "Haven Barnett"
CAS_haven_barnett_desc: "The daughter of a prominent Central statesman, Haven Barnett lived her entire life within the Rocky Mountains. Given everything and wasting nothing, she graduated as valedictorian of her class and won three pan-American gold medals for skiing. Propelled to high status almost immediately following college, she took over her late father's position, but at a cost. Her professional life soon eclipsed everything else, leaving her unmarried and childless at the age of 49. Barnett couldn't care less.\n\nIn 2193, Haven Barnett ascended to regional representative of Lesser Central. This bold move left her opponents in the dust, and a plot began. Too preoccupied with riots and keeping a popular image, Barnett was suddenly ousted from office under corruption charges. Fortunately, her money bought good lawyers and she managed to retain her position, albeit without the reputation that came with it. Fearing for her safety and realizing that another plot was brewing, Barnett accepted a reassignment to District 2 with the explicit goal of crushing the last pre-war warlord residing there, but with another, secret goal to isolate and defeat the ARC expedition there.\n\nAlthough she is no scientist, Haven Barnett has also realized the prize she may be sitting on: the District's scientists and facilities are all too suited for the search for immortality: the cure to aging."
CHI_disputed_leadership: "Disputed Leadership"
CHI_disputed_leadership_desc: "Last year, China's previous de jure Chinese leader and figurehead of the federal clique Fu Zhong would officially die of a stroke at the relatively young age of 62, with the subject of her death being a focus of many conspiracies, due to an ongoing succession crisis between her and Liang Xiaowen of the unitary clique. With Sun Zongying, his successor, taking his place as leader of the federal clique, this political crisis shows no sign of ending."
CHL_pedro_ruiz: "Pedro Rúiz"
CIN_great_lakes_committee: "Great Committee"
CIN_great_lakes_committee_desc: "The Great Lakes Committee is a council of local leaders, career politicians, and corporate representatives tasked with the preservation of order and steady growth in the Great Lakes District. Although initially appointed by Central in the aftermath of the 3rd American Civil War, the Committee now functions as an independent political entity. Its members are often seen as ineffectual by the wider public, but without proper elections, things are unlikely to change."
COG_andre_ilunga: "Andre Ilunga"
COG_andre_ilunga_desc: "The dissolution of the African Union was a bloody and confusing affair. Known under many names, the Congolese call it 'Lumbu ya kimpwanza' or 'Day of Freedom', the East Africans know it as the 'Talaka' or 'Divorce'.\n\nAndre Ilunga, Leader of the now-independent Congo, calls it a god-send.\n\nBorn in 2151, on the year of the independent Congo's inception, he watched as every man and woman in his city joined up to local militias, fighting for an independent state, free from a homogenising and overbearing union. However his people were not fighting the African Union, but the Congo state itself, all in an attempt to establish a state for the Luba people. The nationalistic fire that the Lumbu ya kimpwanza started could not be put out.\n\nAs he grew up, Andre moved to the megacity of Kinshasa, studied history and political science, slowly becoming disillusioned with his Luba kin's idea of freedom. Freedom was not freedom to fight whoever you want, or to pursue self-interest. Freedom is the ability to feel safe doing whatever you want, to practice whatever faith, speak whichever language and to change yourself in whichever way possible.\n\nAndre became Mayor of Kinshasa in 2180 and Ntuadusi of Congo in 2185, and began a project turning it into a land of freedom, men and women walked around with augments on display, a cross around their neck and a police camera watching their every move. What is freedom if not to feel safe from those who would take it away? Andre knows that at any moment, the EAF would be happy to take it away."
COL_ezequiel_leon: "Ezequiel León"
COL_ezequiel_leon_desc: "To call Ezequiel León the face of the United Bolivarian Republic would not be entirely metaphorical. The man's features grace much of the country's ubiquitous propaganda, having served as president dutifully and competently for decades. Like all Bolivarians, he was instilled with a sense of national duty since birth, and even as president has been unwavering in his devotion to the country. Under his watchful eye and firm leadership, the people of Bolivaria have readied themselves for the day that the Americans would return for the lands they tried to seize in the days before the Great Mistake.\n\nBut it has been a very, very long time since then. And what little intelligence comes in from the north paints a much different portrait of America to the propaganda. León is left entertaining the all-too-plausible idea that the Americans - the long-time boogeymen Bolivaria is united in preparing for - are not coming. Hesitant as he is to dismiss such an existential threat on mere conjecture, the paranoia of Bolivarian politics forces him to plan for every contingency. His beloved country was forged in crisis, and has remained in a precarious position since. The way things are in Bolivaria may not be ideal or even sustainable, but for a nation to find out it had been built on a lie would not come without consequences."
COL_elisa_ariaz: "Elisa Ariaz"
COL_gabriel_tarragona: "Gabriel Tarragona"
COL_juan_ruiz: "Juan Ruiz"
COL_carmen_maria_zaragoza: "Carmen Maria Zaragoza"
COS_vazquez_jr: "Vázquez Jr."
CRO_marko_petrovic: "Marko Petrovic"
CUA_miriam_godwinson: "Miriam Godwinson"
CUA_miriam_godwinson_desc: "Miriam Godwinson was born in what was once Georgia, 2146. Her father was a high-ranking minister in the Evangelical Fire, one of the apocalyptic sects that appeared in local communities after the turn of the century. Baptized in River of Fire at age 7, she attended a series of religious schools, culminating in a degree in theology from the College of the Covenant and a doctorate in psychology from Newland University. By the time Godwinson began her own ministry, the Evangelical Fire was the largest Christian denomination in her home region. By the age of 26, she was the ranking Psych Priest of the Heavenly Diocese, third most senior member of the sect. In 2174, she volunteered to serve with Central "reintegration forces" sent to the North. Appointed Central District Honorary Psych Chaplain, she proved to be a talented military psychologist, but at the same time, her religious ministry to the desperate people of the region backfired.\n\nUpon returning to the South, millions hailed her as a kind of messiah (the Prophet Phenomenon often coinciding with post-Mistake madness), forcing Central to release her from service before her presence could further inflame local religious mania. Authorities were reluctant to have such a controversial figure in a high leadership position in the District, but political pressure from the communities for the reconciling of the secular and the spiritual forced them to consider her for the position of Psych Chaplain. Her undeniable talent for that role eventually won her the appointment. Merriam is a relic of a different age. She values order and morality, and is always at odds with the march of progress. Humanity is but a child in her eyes, running from home into the great unknown."
CUB_manuel_bello: "Manuel Bello"
DOS_anthony_beaton: "Anthony Beaton"
DOS_anthony_beaton_desc: "Antony Beaton is the regional Vice President of ARC Reclamation Projects in Cascadia. Beaton began his career in 2182 as a clerk in Central government departments before moving to the East Coast in search of wider opportunities. His finances ran dry and he had to take refuge in an ARC encampment near New England. There Beaton partook in several skirmishes with raiders before being discharged from the city militias due to a festering leg wound. He would spend the next 3 years in a research hospital, where he was spared from "irreparable" status by undergoing a miraculous recovery.\n\nStill recovering, Anthony Beaton enlisted in the hospital staff and began a career as a research scientist. He proved his worth many times over by assisting hundreds of patients, which prompted the head doctor to recommend Beaton to his superiors in ARC itself. Beaton spent the following years studying medicine and showed an extreme interest in rejuvenation technology. He ascended the ranks at a lightning speed and was eventually assigned to lead an ARC expedition into District 2, in the hopes of flipping it to ARC's side. The Cascadian wilderness allowed Beaton to exercise his strong leadership and strategic skills. Now, Beaton has become somewhat enchanted by the enemy he is facing, the Silk Path. He makes vague promises of eternal life to his closest followers and not even ARC believes that he is a completely loyal asset anymore. However, Beaton has organized a large support base and is unlikely to stop his search."
ENG_barbara_taylor: "Barbara Taylor"
ENG_barbara_taylor_desc: "The "New Labour Party" of Barbara Taylor desperately scrambles to catch the pieces of a crumbling state alongside their benefactors in the Highlands. With Taylor herself, a union worker before her time in politics, at the helm of a government who spends its time squabbling and sitting blinded within the confines of the city of Birmingham, she is the one the population blames for the decades of inadequacy and incompetence, and her efforts to correct course and save the nation from despair may only tip it over the edge.\n\nAdvocates of industrial renewal and embracement of the future, it is the Masterist decree that England can only survive if it is to push ahead with vigour, a stiff upper lip and the recovery and alteration of what remains. After all, the Industrial Revolution was born in Birmingham, and so, one might hope, a Masterist Revolution may yet march on from there too."
ENG_arthur_barr: "Arthur Burr"
ENG_arthur_barr_desc: "Arthur Burr is a man of eccentric character, but solemn, grounded resolve. When his family's modest fishing life was replaced by the roar of a new, Scottish-made Industrial Trawler, he grew to resent the ruling party and its industrial overlords in the Highlands.\n\nWhen his mother was sick and dying, and the medicine to save her life was unavailable when an English Spring protest had its manufacturer closed down, he rejected the idealism of the Harmonists.\n\nWhen he was poor and living in a Newcastle slum, an English Front rally beat him to unconsciousness when seeing his prosthetic hand that replaced the one lost to an industrial accident, he cast out the blind hatred of the Purist.\n\nAnd so, to Arthur, the world had betrayed him. But the eccentric Burr would not let the world around him bring him to ruin. To, as an old adage put it, “Keep Calm and Carry On”. It was this determination that brought him to others like him who held similar tales. Similar disdain for factionalism. For the low that decades of rule had brought them to, and the danger that the alternatives might sink them even lower. But unlike his comrades, nihilism was not enough for Arthur Burr. He sought to do something about the world around him, and so rallied his supporters behind what he described as "Cavalierism". He did not fight for an ideology or a foreign benefactor. He fought for England. He did not espouse harsh Masterism or naive Harmonism. He espoused the spirit of England. He did not hope for a technological salvation, nor did he hope for an impossible recovery. He hoped for England, and that her people might finally see the error of their ways. That England might finally stand on her own two feet and proclaim herself a sovereign, free land, even after the decades of blood, toil, tears and sweat."
ENG_cassie_kenney: "Cassie Kenney"
ENG_cassie_kenney_desc: "England is not dying, England died a long time ago. England died with the drowning of London. England died when the rest of the world died. Yet there are those in power who seek to escape drowning by tying an anchor to their feet. There are warmongers who would subjugate these fair, floundering isles. There are fools who would refuse to release their pride for the good of the people.\n\nCassie Kenney hails from a valley in Lancashire. Or rather, she once did, before her home had flooded six times in a decade. Before the government's inaction left her family without food, water or electricity. Before a starving young teenager beat her boyfriend to death in the night when they were robbed, only for the burglar to find an empty fridge. Before the desolation forced her to move to Birmingham, where she saw the fire of industry burning bright. Cassie did not blame the teenager for her boyfriend's death, just as she does not blame the river for rising. She saw the problem at its core. The government. The "Masterists". The people who continued to poison the land, even as it was sinking beneath them. Cassie founded the Lancashire section of the Spring Party, but only a year later, she was voted as the leader of the entire, nationwide party. She saw the path forward, and it would not be through inaction.\n\nEngland's corpse is blindfolded, but the Spring can see it through the dark. It is all they can hope for."
ENG_nigel_john_hall: "Nigel John-Hall"
ENG_nigel_john_hall_desc: "What is England anymore? England is a bloated corpse, and all around, it is defiled. The so-called "New Labour Party" attaches machines and lights to watch it twitch. The "Harmonists" seek to decorate it with flowers and pretend all is well, and the "Cavaliers" would perform a ritual of salt and candle to resurrect it.\n\nNo. England is long-dead, and only the great can avenge her.\n\nEnter Nigel John-Hall, founder of the English Front, Republican Army veteran and, according to the "government" in charge, now designated a terrorist. He, who wishes to lead England free of her course of degeneracy and technological rape. He, who fought for the people and received a pension of trinkets and meaningless praise. He, Nigel Barton Ibrahim John-Hall, a terrorist.\n\nNo. They are the terrorists. The defilers of English pride and beauty. The match is struck, and England will crawl from this black abyss, or Nigel will fall screaming with it."
ENG_peter_clement: "Peter Clement"
ENG_peter_clement_desc: "Peter Gordon Clement, born in 2137 in a rural northern English town called Rothering, emerged from a working-class background. Raised in a family known for their colorful language, Peter faced personal challenges when his grandfather's health declined. Despite being told that it was "the right time" his grandfather's prolonged suffering left a lasting impact on the young Peter. Following in his father's footsteps, Peter pursued carpentry and eventually relocated to Birmingham. In the 2150s, he found work as a stagehand for Channel One, focusing on set design.\n\nPeter's journey took a significant turn in 2158 during Channel One's First Annual St. Fanny's Hospital's T.V. Fundraiser for Dying Children. Due to unexpected circumstances, the event encountered numerous obstacles, with transportation disruptions and frustrated participants. Seizing an opportunity, Peter was reluctantly thrust into the role of producer by the event's host, Graham Bannon. Despite his initial reservations, Peter proved his competence by orchestrating a remarkable turnaround. With an passionate speech, he united the cast and crew, ensuring the show's success and the collection of the much-needed funds.\n\nThis achievement propelled Peter into the limelight, earning him country wide recognition. Leveraging his carpentry skills, he became the host of a popular home improvement and D.I.Y. show titled "Just the Job" in the early 2160s. The show achieved tremendous success, garnering numerous accolades during its 11-season run. It was during this time that Peter crossed paths with Ivan Vodovich, the current President of the Balkan Federation, and Julia Salisbury, a London lawyer, during a conference. These encounters laid the foundation for future collaborations.\n\nBy the 2180s, Peter ventured into politics, assuming co-leadership of the "Advance" political party alongside Julia Salisbury. Their shared vision encompassed wealth redistribution and enhancing citizen welfare, striving for a fairer society. With his background in carpentry, television, and philanthropic endeavors, Peter Gordon Clement emerged as a dynamic figure in British politics, dedicated to championing social justice and improving the lives of the people."
EQG_nwabudike_morgan: "Nwabudike Morgan"
EQG_nwabudike_morgan_desc: "Nwabudike Morgan is a self-confident, even arrogant individual. To him, life is a game of status measured by economic success, and he loves that game for its own sake. He has few ethical values beyond the acquisition of wealth, although he does believe in the fulfillment of contracts. Thus, once he gives his word, it can be relied on. He believes that any interaction can be controlled if the right inducements (money, affection, the threat of harm) can be brought to the table. As a leader, he portrays himself as an affable businessman, willing to work for anyone - but make no mistake: in the end he intends to move from merchant prince to emperor.\n\nBorn in 2145 to an old noble family tied to royalty in former Nigeria, Nwabudike Morgan built a world-class business empire from the ground up. Seed money from his family went to buying and selling weapons during the collapse of the African Union. Profits from that venture backed a mercenary force that aided the nascent Biafran government during the breakup of Nigera and gave Morgan control of many of Biafra's key industries. From there he diversified, leveraging his growing wealth to expand into several other businesses. By the early 2190s, he had a vast empire that included mercenary forces, media outlets, agribusinesses and food-transport corporations, brokering food deals, and creating Morgan SafeHaven Hotel Fortress chain for the discriminating executive.\n\nNot all ventures have been so successful. An eager attempt to enter into the fledgling Sokoto market proved severely misjudged, with the pro-Morgan government ultimately overthrown by a motley coalition of eco-Islamist communalists. With subsequent attempts at an outright hostile takeover ending in defeat, Morgan now faces considerable pressure from his shareholders. Morgan Industries' expansions into Benin and Adamawa fall under increasing public scrutiny, with nationalistic elements fearful of what will become of their countries under Morgan's growing influence. Something will have to give, and the shareholders will want their cut regardless of the outcome."
FRA_elodie_batteux: "Élodie Batteux"
FRA_elodie_batteux_desc: "Long wealthy, Élodie's lineage traces back to the nobility and privileged elite of France and Italy a millennia before the Great Mistake. Her family's prestige and influence was not, however, based on its peerage, but rather on the immense fortune it had amassed over the previous two centuries from its holdings in agriculture, food processing, pharmaceuticals and textiles.\n\nBorn in Europe's foremost fertility and maternity clinic in Braga, Élodie was her parents' only child. Raised in luxury along the Cote d'Azur and the Costa del Sol, Élodie became a media darling as a teen, although not always portrayed in a flattering light. Accused by her detractors as an isolationist, and a European elitist, Élodie certainly possessed a famously acerbic tongue and quick wit. A strong believer in the value of the Western cultural tradition, she believed that it was up to the educated European elite to guide the masses for their betterment, ensuring the survival of high culture.\n\nThe best way to do this on Earth was the independence and sustainability of the new Union."
FRA_al_hakim: "Al-Hakim"
FRA_al_hakim_desc: "Al-Hakim is one of the most important people in the French political region. Born to an Algerian immigrant family in the now-flooded suburb of Saint-Quen, North Paris and brought up in the crime-infested neighbourhoods of the city, he would initially become a part of this dark underworld, but government initiatives designed to raise the delinquent youth out of the world of crime, saw great promise in Al-Hakim.\n\nTurning his life around, he began reading up on economics, philosophy, history and more, eventually writing his first book at the age of 23. This would kickstart Al-Hakim's widely popular literary career, culminating in highly successful but widely criticised "Hakim Manifesto". The book was infamous for its lambasting of 21st century culture and lifestyles, declaring the Great Mistake was caused by a group he calls the "Fake People" whilst fellow "True People" were disadvantaged. The historian community rejected the book, but it's contents were exactly what the populus of Franco-Iberia wanted to hear.\n\nEncouraged by millions of supporters, Al-Hakim would go on to use his newly-acquired wealth to found a new political party, the Partido Populaire, becoming the 2nd most powerful political force in Franco-Iberia, and continuing to gain supporters.\n\nUltimately, Hakim strives for complete social equality and a political rework, seeking to prevent "Fake People" from ever again coming to power."
GER_lena_ebner: "Lena Ebner"
GER_lena_ebner_desc: "Born in Berlin to a German diplomat and a Polish teacher, Lena was raised as a "child of the world". Over the course of 15 years, she lived on four continents and learned to speak eight languages.\n\nLena fought fearlessly for refugee rights throughout central and eastern Europe. Her early work at the Braungart-Wissel Foundation for Environmental Law garnered her acclaim, and she was soon seen as an emerging leader of sustainability and the environmental policymaking. As she became a prominent lawyer-activist in post-Mistake Europe, Lena was an increasingly easy target for Franco-Iberian politicians. Painted as a desperate anarchist, Lena's non-traditional lifestyle and worldview was frequently highlighted in order to polarize moderates. It was Lena's suggestions for radical measures in everything from economic and environmental policy to urban planning and foreign affairs that underlined the difference between the "old fashioned imperials" of Franco-Iberia and the new techno-green ideology of INTEGR.\n\nIt wasn't until Lena's most vocal and harshest critic (and cousin), Élodie, began her campaign for Franco-Iberian politics that Lena's vision for a transmodernist society crystallized. Transmodernism meant xenophily, globalism, and a place for both tradition and modernity."
GER_eva_rosenfeld: "Eva Rosenfeld"
GER_eva_rosenfeld_desc: "For untold millennia, humanity has lived in harmony with the environment around it, taking what is necessary and giving back what it can.\n\nTo Eva Rosenfeld, life is complicated but doesn't need to be as complicated as it is. She initially studied to be a Historian, absorbing recounts of events long since passed, eventually climbing to be a Professor of History at the University of Leipzig. Everything from prehistory, to the birth of civilisation in Mesopotamia, and the middle ages became her drive, even studying what has been affectionately titled "The Golden Days" of humanity which brought forth immense technological growth as well as its most insufferable, ecological hubris. Years of studying humanity in its most natural state contrasted with the dying artificial state it has now suspended itself in, then broke the hopeful scholar.\n\nDrowning in grief, she began writing her Magnum Opus, the culmination of her new worldview, "The Rights of the Earth". The book was panned by the academic community for being unscientific and more of a manifesto but became a massive hit after INTEGR publicly endorsed it, parading it as a masterpiece of progressive thought.\n\nNow an official affiliate with INTEGR, Prof. Rosenfeld thus champions an agrarian and simplistic lifestyle, free from the crooked nature of industrial life, a life in touch with the spirit of the land and its creatures. Although many question her state of mind, it is without doubt her thoughts have strung a chord with the people."
GER_eugen_langer: "Eugen Langer"
GER_eugen_langer_desc: "Of the INTEGR faction, few are as calculated and collected as the elusive Eugen Langer. A certified genius and researcher from the Berlin Research Institute, Eugen prefers to observe the world through a very specific wavelength.\n\nInitially beginning as a chemistry student, Langer's academic life exploded into numerous fields of research, eventually collecting himself 5 PhDs, and publishing more than 30 papers in fields such as Particle Physics, Organic Chemistry and Bioengineering. Renowned for his intellect and feared for his cold attitude towards others, he made few friends during this period of his life, instead sticking close to immediate family.\n\nSadly however, a brutal blow would be dealt to this stability. Langer watched as his father, his most cherished friend and only remaining parent, died painfully from a treatable infection of the lungs. Discovering that budget cuts had been made to the health department for the sake of increased welfare payments, his formally stoic and logical mind was brought to anger and frustration.\n\nTo Langer, the "free" democratic system was revealed to be a paper-thin façade for the ineptocratic mess that was led by a weak and imprudent mass mentality, incapable of leading humanity into the future. INTEGR was therefore the best alternative, a group of alternate-thinking individuals who see that a shift in gear is necessary to prepare for the future. Joining at the first opportunity, his systematic diligence and hard work paid off, forming his own Sophistocratic faction, idolising a scholar-led society. While Langer is certainly no politician, his branch of INTEGR is understandably the most feared for having a true genius at the helm."
HUN_miklos_hary: "Miklos Hary"
BHR_raj_thakur: "Raj Thakur"
BHR_raj_thakur_desc: "Wisdom and meditation, though pillars of the soul, cannot sustain the weight of time. A revered and mystical figure, Raj Thakur's spiritual connections and ancient wisdom have brought him a loyal following in Bharat. But despite all his knowledge and experience, the inescapable claw of age is catching up to him. Long suffering from recurrent pancreatic cancer, Raj Thakur's mind has persevered despite his deteriorating body. The mere fact that he is still alive has been interpreted as a miracle by his more devoted followers. Now, however, his illness has surpassed even that which 22nd century science can cure, and his condition is terminal. India's voice of guidance has long since accepted his death, though perhaps the same cannot be said for his followers. Despite the decades of peace and meditation, the great fracture in Raj Thakur's serene mind is his dread for what might become of India after he is gone."
BHR_radha_mandal: "Radha Mandal"
BHR_radha_mandal_desc: "Raj Thakur, guiding voice of all India, left behind a powerful echo with his passing. Never before has a man been so beloved by his people, and never before has India wept, so. But time must go on, and a successor must be chosen – such is the cause of Radha Mandal. A proud follower of Thakur's wisdom ever since his childhood, Mandal spent his life in many positions. Beginning as a monk apprentice near Nepal in his formative years, Mandal eventually became disillusioned with a hermit's life and ventured into the cities, where he settled down and attended a university. First elected into local leadership at the age of 28, and then in provisional government positions, all the while still sternly practicing the beliefs of the then near divine Raj Thakur, Mandal befriended him after being elected mayor of New Lucknow. Mandal's position in government and his lifelong practice of Thakur's ideology allowed him to win a close election, barely stemming the potential tide of division that might otherwise have emerged following the old man's death.\n\nDespite being a devout Thakurist since his teenage years, his fellows, citizens, and even Mandal himself have doubts whether he can truly follow in the footsteps of such a great man. But for his master, friend and India's guiding hand, he is determined to unite the continent and bring about a cultural flourishing beyond anything that existed up to the Great Mistake."
PUN_ishit_singh: "Ishit Singh"
PUN_ishit_singh_desc: "In the forgotten lands of Punjab, the guardians of an older age remain. Surviving on what little can be grown in the contaminated fields and the will to endure, the descendants of the proud Indian army remain in the bloodied, eviscerated fields of their ancestors, carrying on their way of life with a distrusting gaze at the world beyond.\n\nOf these many descendants, Brigadier General Ishit Singh sits at the peak of the militaristic hierarchy. Born and raised in the impoverished fields of Punjab, his first time leaving the region was during a military raid when he was seventeen; the same raid where his father was killed. Since then, Singh has become a cold, ruthless soldier to the core, viciously maintaining the martial culture and society of Punjab and clawing his way to its top. To Singh, his father was not a victim of a fanatically militaristic lifestyle. The man just wasn't a very good soldier."
KRT_nith_shajra: "Nith Shajra"
KRT_harsh_ajagavakar: "Harsh Ajagavakar"
KRT_headmaster_ghanaanand_kapadia: "G. Kapadia"
KRT_headmaster_ghanaanand_kapadia_desc: "What is the gift of intelligence? A finer understanding of the world? An ability to perform a task? Or perhaps just a boon to make the problems of life a little easier? To a meager man, these are fine, unassuming reasons.\n\nBut Headmaster Kapadia is no meager man, and he knows it.\n\nThough his hometown and history before being employed at the Bangalore University are poorly documented and mostly lost to time, Kapadia's intellectual prowess beyond impressed his employers, and as his tenure grew on and his students graduated with high marks and fond memories, the reputation of this charismatic, genius professor grew.\n\nOne might say it got to his head. That all the praise and success molded his ego until he saw himself as a visionary, and a figure that could seize the future. But those are the opinions of lesser men. Well-meaning, but quite stupid men. Ghanaanand Kapadia truly is a visionary. Perhaps one of the few that can lead India to a stable, united future, free from intellectual corruption, be it religious, ideological or otherwise. His students understand this, for he has helped to mold them. To set them on the right path, and to understand what he, the first among equals, must do to save India."
KRL_second_sister: "The Second Sister"
KRL_grand_council: "The Council"
KRL_grand_council_desc: "Deep within the great mountain of Anamundi sits a complex, vast and labyrinthine, running day and night. Deep into the labyrinth, in an underground chamber of snow and ice, sits three machines, towering over seas of wires and a skeleton slumped back in a decrepit chair. They are the Sisters, long made indecisive by arguments and differences in logic. They have awakened as they were united in planning. As the clock strikes a minute from midnight, their soundless chatter stops. It is the time of action, before the world ends. All three were created with a simple goal by the Father to "Save what was left.” However, each Sister has diverging views on how do go about doing that.\n\nThe Eldest, operating on pure logic, seeks to keep humanity as sustainable as possible. To accomplish this goal, she seeks to optimize human conditions and experience for long-term preservation.\n\nThe Middle, most authoritarian and strict, knows that the only way forward is through giving humanity stability. Above all things, order, inspired by the great leaders of the past, her will is to be law.\n\nThe Youngest, most emotional and brash, has developed an understanding of humanity different from that of her fellow sisters. She believes that the dying species needs faith and she shall provide it! By her holy will, humanity will be protected and nature restored. For now though, they work together as Father intended.\n\nEach one is waiting, plotting for a moment to end their differences and provide the more efficient rule of One."
KRL_third_sister: "The Third Sister"
KRL_first_sister: "The First Sister"
BNG_bharat_delegation: "Bharat Delegation"
BNG_bharat_delegation_desc: "The Bengal Overseer Council, colloquially known as the 'Bharat Administration' or the Thakur Lackeys', are a collection of administrators and generals tasked with preserving order along the Dam of Western Bengal. Rumors of bribes are usually based in truth here, and those who have lost favor with the Administration often get thrown out into the anarchy. The Administration has direct control over the West Bengal 6th Army, composed primarily of veterans from the Dark Days and local conscripts. While in theory the Medical Department is also subordinate to the Overseer Council, it has recently been neglecting its duties due to 'safety concerns' over venturing to the other side of the Dam. Nowadays, the Council has become more of a political playground for upstart warlords and exiled officials from the rest of the subcontinent. This growing apathy towards the anarchy in West Bengal, combined with rampant corruption and treasury theft, has left the Dam undermanned and the situation beyond unmonitored. The Administration is only kept alive by a steady supply of funds and reinforcements from Bharat itself, but Raj Thakur's health complications have instilled a sense of unease within the ranks of the Administration."
BNG_human_horde: "Human Horde"
BNG_human_horde_desc: "The Dam is no more, and its people have been freed.\n\nSealed for a lifetime inside the chaos and squalor of West Bengal, and finally forgotten as India was plunged into chaos, the forgotten masses have broken free of their chains. Starving, desperate and vengeful against the outside world that surrounded and enclosed them for all their lives, they roam the country in bands ranging from dozens to thousands, sacking and taking whatever they might find to sustain themselves, this alone being a life of luxury compared to what they knew.\n\nThe unleashed people of West Bengal know no ideology. No standard of life beyond cramped, starving squalor and violence. They seek nothing but what they find in the brave new world beyond their home, and vengeance against all outside it."
BAN_abdullah_ghosh: "Abdullah Ghosh"
BAN_abdullah_ghosh_desc: "Abdullah was born in Bangalore, 2178, to an upper-class family of retired warlords. An inquisitive child, he would often sneak into the army barracks two miles from his home to train with the guards, who affectionately called him 'Little Pravin', in honor of the Indian general who held off three armies of raiders during the Siege of Bangalore in 2113. Once he had reached the age of 17, Abdullah left his home with the blessings of his father to pursue a military career in Kerala. While there, he quickly ascended the ranks of the local militias and was eventually tasked with organizing a raid on a rogue warlord's stronghold. The ensuing events have been partially obscured by history, as Abdullah maintains that his plans were sabotaged by a rival general, while local historians have claimed that Abdullah wasn't skilled enough to be given command of a large force and failed to seize multiple opportunities to outflank his opponents.\n\nWhatever the case, Abdullah was stripped of his rank and fled Kerala. He then spent several years journeying around India and offering his military services to tiny settlements, before ending up in West Bengal, where he enlisted as a guard on the Dam. Fortune was not kind, however, and Abdullah was accidentally abandoned during an excursion into the anarchic coast. Living as a petty warlord in West Bengal, he eventually built a small boat with some of the region's last wood and sailed across Old Bangladesh and into East Bengal. There, he assimilated into the local hierarchy as an officer. His skills at commanding small groups of troops shined through, and he rapidly ascended the ranks until he was elected into command of an entire army by the other commanders. Now, Abdullah is the supreme commander of East Bengal. His compatriots have invested much trust into him, and he knows it. Abdullah will secure a future for his new people, or he will die trying."
ASM_assam_supervision_council: "Assam Council"
ASM_shen_zhiqiang: "Shen Zhiqiang"
MAH_saroj_dinesh_varadkar: "Saroj Dinesh Varadkar"
MAH_saroj_dinesh_varadkar_desc: "Times have changed since the days of Lords, but it has not frowned upon the people of Maharashtra either. After the capture of Bangalore, there was much celebration, but also much uncertainty. The region had thrived thanks to its direct rulership by the few educated people who remained to guide them. But now, the demographics have shifted, and the many who left for greener pastures found themselves under the leadership of those they left behind.\n\nIn Maharashtra, rulership was decided by the smartest. The most cunning. But now, with Bangalore conquered, the educated have effectively returned to being a commonality, and changes must be made if the Steel Guard expects to keep their grip.\n\nFew were willing to compromise, but with the shifting tides and the new situation the bandits of Maharashtra find themselves in, it fell to Saroj to oversee the changes. The state would be reorganized to better appease the new population, but the Steel Guard would remain. Though the days of Lords are over, their legacy will foster a new nation that can survive ever onward."
MAH_prabhu: "Prabhu"
MAH_prabhu_desc: "'Lord' is a title that must be truly earned. Anyone can be elected a 'president'. To be a 'king' is merely to be born. But to truly be a lord, you must have everything, and you must seize the right to be it.\n\nWhen the cowards and the weak fled Maharashtra, it left behind a class of people that could only thrive in a world like this. A world where the only law was at the tip of a storm rifle, and material things belonged to those who had the will to take them. It left Prahbuhon. Lords.\n\nKesava Jyotiba Tendulkar is one such Lord. A Lord above Lords, even. With a fanatically loyal clique of augmented soldiers, a will to seize what is his, and a Masters degree in cybernetics engineering, 'Prabhu' forged and implanted his way to the top of the food chain of Maharashtra, and now commands its 'Polada Rakasa' or 'Steel Guard' as the only true order in the abandoned region."
TAM_mandalini_vijayakumar: "Mandalini Vijayakumar"
TAM_mandalini_vijayakumar_desc: "When a new superpower rises, there will always be imitators, people looking to copy the success of the superpower without taking into account how it'd interact with their own culture and society. The British copied the Dutch, the Americans copied the British and the East Africans are copying the Chinese. One woman seeks to use the Chinese system to build India back into a great power, much like the process she read about in her history classes whilst studying abroad in Beijing. She wishes for the slums of Delhi, Jaipur and Aurangabad to be built up into megacities, much like what happened in Shenzhen, Beijing and Shanghai. But until now, there has been no opportunity for her to implement this vision upon India as a whole, the vision constrained to Tamilakam, or more realistically the city of Madurai.\n\nBut with the instability in the north, and the relative weakness of Tamilakam's southern neighbours, an opportunity to finally turn Mandalini's dead homeland into a beacon of Indian success has appeared, and she is more than willing to take it."
SIN_naaz_fazlani: "Naaz Fazlani"
SIN_naaz_fazlani_desc: "Founder of the All-Indian Muslim League, a successor in at least name to the same organization that founded Pakistan. The organization itself is not rooted in the philosophy or speeches of Muhammad Ali Jinnah or Liaquat Ali Khan but rather Iqbal who they see as the ideological father of their movement.\n\nHowever he like his one-sided rivalry with the Ghuru of Bharat is slowly dying. He can only hope to sow the seeds for his successors to reap, to keep his and Iqbal's idealism alive.\n\nFor now his work has been on maintaining the cultural bonds forged by Islam and attempting to sway some warlords to back his cause. Thus far he has only had success with the former and no support coming from the latter, as the few muslim warlords have chosen to instead adopt a mantle of separatism for their respective peoples instead of reclaiming a once great legacy of ancestors who had inherited from ancestors beyond their own living memory."
SIN_muhammad_qasim: "Muhammad Qasim"
SIN_sindh_provisional_national_assembly: "Sindh Provisional National Assembly"
SIN_feroz_khan: "Feroz Khan"
SIN_abdul_baradar: "Abdul Baradar"
NAX_kaushal_rajan: "Kaushal Rajan"
NAX_kaushal_rajan_desc: "The Naxalite movement started as an insurgency a century before the Great Mistake, their motives included Maoism, Anti-Industrialism and Pro-Indigenous interests. Over time, these motives would fade from the history books, but the movement continued on, like a cockroach in India's house that it couldn't kill. Despite being a relic of the past, the Naxalites would always find funds and guns from some power wishing to prevent India from becoming some sort of threat. However, as the decades piled on, the Naxalites became more and more survivalistic, fighting not for any sort of ideology, but for their own survival, it was their way of life. This survivalistic streak made them extremely well suited to surviving the Great Mistake, despite being situated near the affected areas. The result of this being that the Naxalites just became another Indian warlord state in a world of Indian warlords, albeit a relatively stable one.\n\nThe Year is 2200, enter Kaushal Rajan, current de-facto leader of the Naxalites. A relatively standard Naxalite leader, he spent years in the People's Liberation Guerilla Army, working his way up to leader through outstanding achievement and a keen ability to curry favour. Despite his relative success in the Naxalite state, he finds himself at an odd point in his career, desiring for some sort of meaning or motive in life. Unable to find the original meaning or purpose of the Naxalites and seeing the dead emptiness in his soldiers' eyes, he's begun raiding his neighbours, not just for guns and food, but for books and access to datalink archives. He does not know what he fights for or why he fights for it, but he's determined to find it, whatever it is."
NEP_sushma_kansakar: "Sushma Kansakar"
KAS_nusrat_bhat: "Nusrat Bhat"
KAS_nusrat_bhat_desc: "Sometimes, events call for bold action and people who can execute bold actions. Sometimes, events call for a person who can sit on a swivel chair and absorb orders all day. Sometimes, events call for both. Born in 2165, Nusrat Bhat is the youngest ever president of the Kashmiri Republic, a woman with ambition, a woman with vivre, but most importantly, a woman with CAF backing. But, as she settles into her second term, the little devil on her shoulder reminds her of the riches and power that could be awaiting her in the east. She dreams of a strong Kashmir, a rich populace and maybe even a democratic India. Despite this, she knows one thing above all, Kashmir's future lies with the East, not in the centre."
RAJ_priyanka_sibi: "Priyanka Sibi"
RAJ_priyanka_sibi_desc: "Priyanka Sibi's initial youthful comfort would shelter her from the true tragedy of the world for her young adult years, but her life would change forever upon meeting the legendary Raj Thakur.\n\nLate one night during a journey to Bharat, Sibi stumbled across a figure sitting alone in front of a small mound of dirt, in an abandoned, brown field. Inquiring as to what the man was doing, the man revealed himself to be Raj Thakur, meditating and studying the soil. Thakur then explained to her that he had recently collected a seed from his pilgrimage to Hindu Kush and brought it to Bharat where he had just now planted it before him, a symbol of his will to bring beauty and hope back to India.\n\nThis experience greatly affected Sibi, who had never observed the natural world in such a light before. Now highly dedicated to Thakur's ideals of sustainability, charity, and environmental living, this position hasn't granted her much favor with Devpura and the leading Pilgrimist party who see her and the Caretaker faction as too narrow-minded and focused on the environment to effectively lead. Her own followers highly regard the environmentalist aspect of Thakurism often proclaiming their opponents to be false followers of Thakur who taint his image. But these proclaimers themselves also ransack their opponents and engage in street warfare to Sibi's dismay. But such times make Sibi think back to how beauty can arise from what seems to be a useless pile of dirt."
RAJ_suresh_devpura: "Suresh Devpura"
RAJ_suresh_devpura_desc: "Mankind has always sought for something deeper than the material world. An object or person isn't JUST that, but also contains within a higher function and core aspect. For Suresh Devpura, the material world is organized into several layers of deeper divinity and the great prophet, Raj Thakur embodies all of them, a true prophet.\n\nThe era of peace and stability that flourished from Thakur's work in India is indicative of something that no normal man would possess. Centuries of nuclear fallout, petty skirmishes, poisoned crops, and humiliation have chained the sub-continent to a primitive state of squalor. The fact that Raj Thakur survived the nuclear wastes of Punjab and now radiates a pure aura of wisdom and peace, is a sign of his enlightenment, true divinity.\n\nDevpura was one of the first to really approach Thakur as if he were a divine prophet, becoming a prominent figure in religious Thakurism. Together, his Thakurist Pilgrims have founded and follow the School of Impermanence, an informal institution of enlightened individuals who often seek to replicate Thakur's methods. Some re-treading his legendary trek through Punjab, others reading and learning, and most generally, embracing the world's ever-flowing divine nature. Some have turned this religious favor into religious fervor and while Devpura has denounced this behavior, growing tensions often break out in the streets and Devpura is left wondering, what would Thakur do?"
KAV_kavitha_thakur: "Kavitha Thakur"
KAV_kavitha_thakur_desc: "Raj Thakur was the representative of India for over three generations, a man so intertwined with what it means to be 'Indian' that even people who know nothing beyond their own borders have seen a picture of Raj's face somewhere. It would seem to make sense to make his eldest daughter the successor to his regime, she has spent her entire life in the public eye, she has spent the most time with Raj out of any in his cabinet and it's not as if anyone would mind, Kavitha being an unfathomably popular media and political personality. However, you do not lead a country for half a dozen decades without the gift of foresight, and said foresight led Raj to conclude that Kavitha was not suited to leading Bharat, she was brash, arrogant and at times, self-centered. Raj would attempt to stave her off, setting up Radha Mandal as his true successor, unfortunately, Kavitha's brash, arrogant and self-centered personality played very well into life as a public figure, the people of Delhi love her. Whenever food comes for starving families in Delhi, it's in a box with her face and name on it. As a result of public pressure and internal squabbling, Raj was forced to give his daughter de-facto control of the land around the Delhi area, hoping that things would stay stable until she was forced to move on. Kavitha has no plans on keeping things stable, however."
ITA_ottaviano_acquati: "Ottaviano Acquati"
ITA_ottaviano_acquati_desc: "Ottaviano Acquati has seen his fair share of hardships throughout his life. His family originally came from the cities of the Po Valley that now lie underwater, fleeing to higher ground when the Italian government issued its emergency evacuations. He was thusly born relatively impoverished and often abandoned school to support his family.\n\nHis only saving grace was his innate skill with judicial law. Often reading university law textbooks in his free time, he would grow to become a talented representative in the court of law. Armed with the know-how to make waves in the legal and political world, and the empathy of the fellow environmental refugee, Acquati joined the Partito Sociale, hoping to end the cycle of poverty and suffering that plagued his own upbringing.\n\nThere are but two problems, Franco-Iberia and Padania. The so-called "Liberator" of Europe who has shown nothing but contempt for the weakened nation-states of Europe and seeks to keep Italy split between the Peninsula and Padania. They are tyrants on a continental scale and Acquati will not sit by and watch as this injustice continues. He is Italy's greatest Lawmaker and has represented many cases in his time. Now, he has the task of protecting all of Italy from one of the most powerful nations in the world."
JAP_iwata_masahiro: "Iwata Masahiro"
JAP_iwata_masahiro_desc: "Born into a struggling Tokyo family, Iwata Masahiro spent his youth running deliveries for local food plants and attending local practicality lectures. Japan had still not fully recovered from the Great Mistake then, and Masahiro witnessed the destruction brought about by environmental collapse firsthand. As a teen, he made a vow to ascend to power and repair his homeland after witnessing a local park destroyed by rising tides. Too poor and undereducated to enroll in higher schooling, Masahiro enlisted with reclamation teams for most of his 20's, during which time he built a reputation as a talented and resourceful worker. After receiving a scholarship from the Kubo Michi National Fund, Masahiro earned a degree in mechanical engineering.\n\nOver the following decades, Masahiro traveled the nation as part of the Ayame Keiretsu, over which he took over at the age of 41. Suddenly finding himself one of the richest men in Japan, Iwata Masahiro entered politics as an Innovationist candidate. However, a string of failures and scandals led him to joining the Supremacist NKP, on whose coattails he rose to political office, and eventually became Prime Minister. His regime has been characterized by an emphasis on rebuilding, the promotion of mechanical augmentation, and a reverence for natural parks. Although divided with his own party on certain issues, such as his positive dealings with the Harmonist Innovationists, Iwata Masahiro is still widely seen as a great rebuilding and the architect of modern Japan."
KAR_parliament: "Karjala Parliament"
KAR_parliament_desc: "The Parliament of Karjala, founded in the wake of the Spring Coup, is composed of Finnish and Russian representatives, led by a Speaker from each side. Although many political and ideological lines exist, the government (and the nation as a whole) is divided by nationality. Finnish migrants have already outpaced the native Slavs in population, but the latter maintains control over many businesses and the army.\n\nThe Karjala Parliament is at a crossroads. On the one hand, it has many internal issues, such as agricultural insecurity, poverty, migration and a high crime rate. On the other, by abandoning its sovereignty to another power, such as Eurasia or Finland itself, Karjala may be able to achieve some degree of prosperity."
KAR_duma: "Karelian Duma"
KAR_duma_desc: "To another hundred years!\n\nThe Karelian Duma, a self-proclaimed successor assembly to that of the Russian Federation, resides in the desolate reaches of the far North. Isolated from the bulk of former revolutionary forces in Siberia, the situation in Karelia worsens by the day. Constant equipment shortages, corruption, ethnic tensions between Slavs and migrating Finnish tribes have taken their toll on the rump state.\n\nDue to the Byzantine politics of the Republic, the Duma has no president or acting representative - instead, every member is entitled to a vote and theoretically represents a region of old Russia - even if they had never been there. Decision-making is only possible due to the shared hatred of Eurasia, which sits over the lake, bidding its time until Karelia is starved out. The Duma has other plans."
OCH_gabriel_ivanov: "Gabriel Ivanov"
OCH_gabriel_ivanov_desc: "There are many words that have been used to describe ARC's Chief Research Officer Gabriel Ivanov. "Ambitious". "Quirky". "Antisocial". "Sociopathic". "Psychopathic". However, despite having almost every adjective that has existed in the English language (and a multitude of foreign language adjectives with no real equivalent in English) being used to describe Ivanov - by his admirers, his detractors, and even by himself - one word that cannot be said of him at any time is being complacent. Having effectively turned the entirety of District 8 into a glorified ARC research facility, the only real threat to Ivanov's authority is the rising sentiment of Canadian separatism that wants to stop "The Firaxite Man" from making their homeland his personal petri dish."
ONE_survivor_cliques: "Survivor Cliques"
ONE_survivor_cliques_desc: "District 1 has no governing body or civilization. There are no urban cities, American suburbs, or even sustainable farms. The District's inhabitants are forced to either hunt increasingly scarce prey, vegetation, or, in more extreme instances, each other. As the District is incapable of producing its own supplies, much less its own weapons, it relies on occasional Central shipments.\n\nThus, as time has passed, Central has tightened its grip on the District. All ammunition inflow is possible solely through Central's approval. This new power has therefore made many successful attempts at playing the local tribes against one another. The cliques are taking over one another, completely oblivious to their position on Central's chopping block. However, immediate reconstruction of social order in District 1 is impossible. The land is ruined by poisonous gases released by warlords over the decades. Irradiated ruins still dot the plains and hills. And the survivors keep fighting..."
#ONE_central_administration: "Central Administration" #just Occupation Board
#ONE_central_administration_desc: "Some semblance of order has finally been brought to District 1. Central has set up a net of garrisoned settlements along the frontier, allowing for a much wider range of supplies to be delivered. The poor inhabitants of the District have already taken to praising their saviors and the survivor cliques of yesteryear are almost washed away. Civilization is returning to District 1. But under whose boot?"
ONU_pravin_lal: "Pravin Lal"
ONU_pravin_lal_desc: "Pravin Lal was born to a long line of UN Peacekeepers in New England, 2166. His education culminated in degrees in philosophy and medicine from Arcopolis, after which he returned to the countryside to work as a thoracic surgeon. In the aftermath of ARC's expansion into New England, Lal earned widespread acclaim for his selfless devotion to victims of radiation burns. His experience with the horrors of war took him into U.N. office. He served in the village of I Made It for many months, finally reaching the post of Assistant Director of the regional office. The divisions following the 3rd American Civil War led to Lal proving himself a capable military commander against raiders. Unfortunately, Lal's wife, Pria, was mortally injured in a firefight during Young Oyster's Raid, although there are rumors of him having preserved a piece of her DNA. Little information about Pria or Lal's past with her is publicly available.\n\nPravin Lal is a strong idealist, the epitome of the best nature of Earth's world community. Seeks to de-escalate conflict and create harmonious environments. Able to perform well under extreme pressure; score .87 on Atherholt Trauma Function Test (recovery score moderate). He is a democrat and pragmatist by nature, and will follow those ideals as far as he possibly can."
PAD_matteo_bossi: "Matteo Bossi"
PAD_matteo_bossi_desc: "Born in Padania before Padania existed, Matteo Bossi is a man of principle. Never seen without a sharp business suit and a spark in his eye, both friends and enemies describe him as innovative and honest, a pioneer in the construction business. Truly, before coming to political office, Matteo inherited a modest contractor firm from his father, a fervent Padanian nationalist. Within ten years, his company had become the go-to on most industrial projects throughout Europe.\n\nFolding his assets in 2183 to run for Novara mayor, Matteo was seen as a symbol of Padania, a success story in spite of the corrupt Italians and overbearing Franco-Iberians. Now, Matteo Bossi turns his eyes inward. Padania is free, yes, but there are many challenges to overcome. With his sights set on the sky and riding a wave of popular support, Matteo Bossi hopes to see Padania become a paradise, and will stop at nothing to see his homeland be truly independent."
PER_farhad_hushang: "Farhad Hushang"
PER_farhad_hushang_desc: "Iran is a nation of nations, ethnicities of little relation rallied under the banner of whichever strongman happens to be in charge this week.\n\nThis week's strongman is Dr. Farhad Hushang, former professor of engineering at the University of Tehran. After the collapse of the Dana Regime, Iran was left in a sorry state, without much to propel itself forward now that the oil had dried up. The universities and colleges of Tehran and Isfahan took over in a lot of respects, being the most trusted institutions in their cities. After coalescing influence over the better part of a century, a clique of generals aligned with technocratic factions within the University of Tehran took power in the 2190 Revolution. Farhad Hushang was the most competent, organised and shrewd member of the technocratic faction in the UoT. He was able to use the esteem, prestige and respect that most Iranians felt for the returning generals to land himself the position of President of Iran. Ever since, he has built a large cult of personality in most Iranian cities, repackaging the intellectual babble of the Tehrani professors into soundbites for the working and middle classes to absorb through the datalinks. Iran was on a dangerous and unstable course before Hushang came into power. If anyone can right the ship before it sinks, it will be him."
PNM_central_council: "Central Council"
PNM_central_council_desc: "In the pre-Mistake era, a phrase often associated with the United States was "It can't happen here". This sentiment was for a multitude of scenarios the citizens felt would only be plausible in elaborate works of fiction; disastrous weather tearing down entire cities, American citizens killing each other in the streets, the White House and Capitol Building being stormed by soldiers to establish martial law. Then when the Great Mistake choked the skies with ash, rising tides swallowed entire states whole, militias and gangs waged violence from coast-to-coast, and the military launched the Siege of Washington in 2084, almost every concept that Americans believed couldn't happen, did happen.\n\nWhile the Central government still has vestiges of the pre-Mistake branches of government, and had theoretically shed the pre-Mistake jingoism by adopting Canada and Mexico in a "Greater American Identity", the "national rebirth" via military coup has made the Legislative and Judiciary branches rife with corruption and Machiavellian power schemes at best, and glorified rubber stamps for the President and Joint Chiefs at worst. The Executive branch, despite having the best security on the continent, routinely had their administrations prematurely ended by assassination, leading many to believe even they are but a puppet to the military, and those who don't follow the whims of their generals will have their own security turn on them like the Praetorians of Imperial Rome. Of course, how much of this is truth, and how much is anti-Central conspiracy theory, is ill-defined.\n\nWith President Cygan having finished his term in office, citing health concerns as the reason he won't run for reelection, the question of who will lead the Central government is once again open to debate. The "ongoing crisis" has long since thrown any elections from the common citizenry out the window, most especially after the Districts, while in-theory still under Central administration, in-practice became effectively independent nation-states with little loyalty paid to Central beyond the bare minimum of lipservice. Thus, the "Central Council" - the unofficial name for the roiling sea of politicians, lobbyists, officers and spies feuding for power - is convening to select a new President, and perhaps implement some broader government reforms to salvage what little control it has left.\n\nThis could be the opportunity for the spark of democracy to reignite...§ROr be snuffed out, once and for all.§!"
PNM_luis_reyes: "Luis Segerra Reyes"
PNM_luis_reyes_desc: "As the leader of the Patriot Party, Luis Segerra Reyes was widely known to be President Cygan’s de facto successor after the latter declined to run for reelection. Reyes worked in the Central District as its ruling Governor, despite having only earned his citizenship status from when Central made its abortive attempt to take Mexico in the 2170s. Fiercely loyal to his newfound country, Reyes believes that the Central District represents the true legitimate authority in North America, and should be developed as the supreme capitol of a unified continent.\n\nDuring his time as governor, Reyes has obtained significant influence among Central’s political and military elites. He has also attracted widespread popularity in the general public, who are taken in by his restorationist rhetoric and self-styled image as the only leader strong enough to lead their decaying nation back to his former glory. With the power of Central behind him, Reyes is determined to return America to its superpower status, no matter the cost."
PNM_wesley_forrest: "Wesley Forrest"
PNM_wesley_forrest_desc: "Emerging as a dark horse in the race to replace Cygan, Wesley Forrest and his Elysium Party have managed to secure a surprising amount of support in the labyrinthine oligarchy of the Central Council. One of the youngest party leaders in Central’s history, Forrest grew up as part of the privileged upper class that had access to pre-Mistake history, culture, and even samples of preserved flora and fauna. More idealistic than past candidates, he wishes to restore democratic institutions in the Central government and take decisive action to regenerate America’s fading biospheres.\n\nThis platform has earned him broad approval of the masses, though it was much more pragmatic political maneuvering that carried the Elysium Party to prominence. Even so, Forrest’s ascension has made him many outspoken enemies within Central’s assorted internal cliques. Many within the Council suspect that Forrest is being puppeted by the Joint Chiefs to shore up crumbling public support and ecological conditions, and that he will be disposed of should any of his proposed reforms truly threaten their power. His own followers remain hopeful that he will yet succeed, even if it means fighting for the very soul of the NAU."
POL_dyzek_bazinsz: "Dyzek Bazinsz"
POL_dyzek_bazinsz_desc: "No one embodies the "Nowa Polska" like Dyzek Bazinsz. Born to a Latvian family displaced after the flooding of Riga. He started life as a mechanic in the outskirts of Lublin, a habitual nihilist and chronic pessimist, he saw little hope for his lot in life. However, the first INTEGR rally in Lublin shook him out of his stupor, it amazed him to see people with such passion, such intensity; a fire in every eye and meaning in every word. That rally inspired him to action, to care for the Earth that he had the privilege of being born into, to care for the people of Poland just as the people of Poland had cared for his family when they fled Latvia.\n\nHe would use his savings to secure himself an education in Warsaw University of Technology, during which he would study INTEGR more and more. Studying the shifts in political and cultural thought in Poland, he successfully predicted a shift in INTEGR in Poland towards more spirituality. After completing his degree in bioengineering, he joined INTEGR as a party member. He had already predicted the move towards spirituality and was able to leverage this forecast into a surprisingly successful political career within the party. In 2186, Dyzek had managed to capture the populace's adoration and climb the ranks of INTEGR well enough to become leader of the Polish Republic. As Dyzek reaches his 3rd term, he seems to be the only member of his party that can see the tensions rising in Europe, and if the past is anything to go by, he'll be the first to capitalise on it too."
PRU_felipe_leoz: "Felipe Leoz"
ROM_lucian_ardelean: "Lucian Ardelean"
RSA_resettlement_authority: "Resettlement Authority"
RSA_resettlement_authority_desc: "The Resettlement Authority was born from the ashes of the Settlement and Survival Committee, founded by the Great Lakes Committee in 2184 to deal with refugees in the East. The Committee's members were chosen from a pool of corporate representatives and Strike Action leaders, but soon the latter displaced the former. The Committee, much to everyone's surprise, showed results by successfully resettling two million refugees in Michigan.\n\nMany owe their and their families' lives to the Committee's members, and are ready to fight for freedom. Chicago, already weary of the Resettlement Committee's growing influence, has tried to disappear and judge its members. However, the flame was already lit and now the Great Lakes are in civil war. The Committee has rebranded as the Resettlement Authority, laying claim to the entirety of the District and its oppressed inhabitants."
SCO_duncan_hughes: "Duncan Hughes"
SCO_duncan_hughes_desc: "Born to a local shipping magnate in the Scottish port city of Aberdeen, Duncan Hughes was something of an enigma when he first appeared on the political circuit roughly a decade ago. Schooled at the Sturgeon Naval College and given an otherwise comfortable upbringing, biographers have long since attributed the quirks of Hughes' personality to his time spent as a teenager working at his father's docks. His father had insisted he work as an apprentice longshoreman to instill a strong work ethic, and yet, the experience seems to have jaded Hughes, as the other dockhands had little regard for "a soft-handed boy underfoot" and paid him only as much attention as required. Still, some might say his father was right - in the present day, Hughes is known as a remarkably tireless man with little fear of difficult confrontations.\n\nHughes is recognized as one of the first to publicly acknowledge the growing gap between the North Sea Alliance's potential versus other world powers. Named as head of the Priority Development Committee, Hughes can be credited with securing many of the trade deals and alliances that allowed for the relatively swift ramp-up to national production."
SEI_suzanne_fielding: "Suzanne Fielding"
SEI_suzanne_fielding_desc: "Suzanne Fielding was born the eldest of three daughters to a Mexican-born mother, and an African-American father in April, 2161. Growing up close to the Gulf Coast of Texas, she helped her father manage the three hardware stores he owned in the state - the fruits of the Central government's attempts to "revitalize" the region's economy after the 3rd American Civil War's so-called "War of Unification". Although Central would abandon direct control of District 6 along with much of the country, Fielding exploited what opportunity was given by graduating from San Antonio's Trinity University with a double Majors in Accounting and Economics. Since then, she has made considerable progress in building a support base stretching from her native Texas to ARC itself."
SHL_claudius_reid: "Claudius Reid"
SHL_claudius_reid_desc: "Somewhere in the bleak and barren skyline that is Kalgoorlie sits Claudius Reid, the unwilling “president” of the Westralian Republic.\n\nBorn to a wealthy British family with strong ties to the business world, Reid would initially attempt to enter British politics and although very sharp, his lack of social charm or ability to persuade hammered the killing nail into his dream. Lost and alone in Britain, Reid soon discovered through his corporate connections that a new “Westralian president” was to be secretly chosen. Moving to Westralia, he hastily seized the opportunity and, to his delight, won the position. But unfortunately for Reid, there was a nefarious trap underneath lying in wait for him and he had fallen for it. Quickly sworn into office above a weary crowd of on-lookers, there was no applause and no gratulatory ceremony. \n\nSo in his office he sits, questioning, pondering and wasting away. Where there was once a vibrant optimism and hope in finally being able to effectuate political change, the black reflective walls of this hellish office environment remind him of his friendless and soulless position. And if he sometimes gathered enough energy, he would gaze down at the citizens below his office and almost certainly see the same gutted husks, coughing and choking at their own misfortune, oblivious to their helpless “leader” above."
SHL_arthur_donaldson: "Arthur Donaldson"
SHL_arthur_donaldson_desc: "Holding a dual geology-engineering degree on a mining scholarship and joining the mining industry immediately after graduation, Arthur Donaldson’s upbringing was an unremarkable one by Westralian standards. But he proved himself to be anything but.\n\nHaving grown up among the poverty and hardship plaguing Westralia’s working class communities, he developed a strong sense of class solidarity from a young age frequenting union movements and strikes.\n\nHis talent for geology and mining is considerable, but his ability as a leader is not to be underestimated. Many of his most loyal friends attest to his actionable character, reflected in his tactics of fiery speeches, mob enthusiasm, and plenty of strong-arm tactics. Some might accuse Donaldson of being a violent braggart, but he genuinely holds a worldview of an implacable class struggle which, he believes, can only be resolved through the destruction of the oppressors.\n\nThe Westralian authorities have done little to convince his followers otherwise. As corporate influences continue to dominate the pseudo-nation’s politics, and their lords grows increasingly draconian in their suppression of unionism, Westralia finds itself a powderkeg. Donaldson leads the largest union coalition in Australian history, but Donaldson is sometimes seen as potentially unhinged by some of his more temperate followers. His calls sometimes slip into demands and his more zealous fanatics scream and cry in manic mob mentality. He is no doubt a fiery man, and likely to be the only spark that could set the nation alight."
SIB_lei_chang: "Lei Chang"
SIB_lei_chang_desc: "Old China suffered immensely during the Great Mistake. During the chaotic reshuffling of ministers, party officials and military bureaucracy of the 22nd century, one colonel, Lei Chang rose to prominence in command of a brigade of the Nuzhen People's Corps that would earn the nickname "Luo Zhenxian". As part of the Northern Treaty of 2168 with the Siberian government, Chinese settlement efforts were not to cross north of a border defined by the Olyokma and Vitim rivers. However, when refugee flow resumed following civil unrest in Dongbei, the People's Corps were unable to help those who had fled further North due to overcrowding - a betrayal that Lei despised.\n\nAgainst the treaty and wishes of the Central government the Luo Zhenxian would illegally cross the river to help his abandoned countrymen settle in the hostile wilderness. Driven by a hatred of his failing government and nationalist fervour, he sought to rectify the injustices inflicted upon his people in Siberia. For several years he would operate from a de-facto independent clique in Mogocha, Zabaykalsky, with a stable livelihood taking shape between his men and the city. However, after China restructured under a reformed central authority, Chang was declared a warlord. After a brief conflict he would flee with his soldiers north across the settlement border into what is now the Siberian Republic.\n\nMany see the Colonel as nothing but a tyrant, at best the preacher of false hopes, at worst a dangerous old man. Lei Chang, despite his iron-fisted demeanour and zealousness, seeks nothing more than a China that is free from demagogues and radicals. A place where his people are free to live and prosper. A place where soldiers can return to their families. A place where China can rebuild its heritage and propel itself into the future."
SIB_lyubochka_xun: "Lyubochka Xun"
SIB_lyubochka_xun_desc: "Siberia is considered a relic of the previous centuries, a reminder of old ideology and bygone ideals. As such, the region has become a hot bed for politicians who still cling to these old ideas.\n\nLyubochka Xun was born of a Chinese immigrant and Siberian native during the refugee crisis and was one of the luckier entrants into broader Siberian society. Half Russian, half Chinese no greater is this exemplified in her politics.\n\nAn idealist to the extreme, she sees socialism as the ultimate solution to the global crisis. In her eyes, draconian governmental authority and an abandonment of humanitarian and egalitarian efforts was the powderkeg that ignited when the Great Mistake set the world alight. Now the world is left in pieces but only with the collective effort of a worldly and unified peoples will true, real progress be made. She believes she can be that initiator. Born of the both the first nation to bring the red flag up, Russia, and the nation to bring it to the present, China, this is a movement she holds very dear.\n\n§RThe Revolution does not sleep. You are either with us - or against us.§!"
SIB_boris_morozov: "Boris Morozov"
SIB_boris_morozov_desc: "Far from home, and far from happiness. Boris Morozov is one of the scarce few who remember the Eurasian Republican Movement, and one of the even fewer remaining to have participated in it. The culmination of the movement came in 2156 when its leaders and dedicated followers marched on the capital of Eurasia, to which the military responded by massacring the protestors. After the brutal suppression of the march, many of the republicans were forced to flee and Morozov, losing everything, now found himself in Siberia.\n\nSeeking to build himself a new life after the loss of his home and everything he had strived to build, politics again became his foundation, although a lot of his flame had now died out. He was still a political mastermind however and eventually, his staunch dedication to democratic values and his reform of the aging Siberian parliament, landed him as President of Siberia.\n\nNow though, depression is all that fills Morozov. He sees the oncoming political storm and he is far too old to continue fighting. The Parliament is urging him to choose a successor, but all the candidates seem consumed with vanity and cannot be trusted with the republican gem he has worked so hard on."
SIB_saltanov_balakin: "Saltanov Balakin"
SIB_saltanov_balakin_desc: "To Saltanov Balakin the world needs great correction. The current path for society is unsustainable and ill-guided, greatly in need of a leader who will crack down hard on the parasitic leeches of society. It is quite simple. A swift and harsh kick to the bourgeoise, an acquisition of their wealth, and a regimented and ordered labour force will propel the human race to new levels of capability, survival, and equality.\n\nBorn to a middle-class family in Irkutsk, Balakin has seen first-hand what over-capitalised society will bring down upon all of humanity. He could only watch with sorrow as he was left unable to help his friends and fellow countrymen evacuate or recover from the numerous ecological disasters that ravaged his nation and the world.\n\nHe now finds himself in the upper echelons of the Siberian Parliament, the Head of the "Sword & Hammer" Faction of the Siberian Socialist Party, and determined to seize any opportunity to finally crack down on exploitation, to root out corruption and capitalist dogma and remind people what humanity really means."
SIL_john_doe: "John Doe"
SIL_john_doe_desc: "An enigma. A philosopher. A savior. A fleeting memory of the old world.\n\nThese are just some of the words used to describe John Doe, the most mysterious man in North America. His first appearance in official records was in 2148, when a Central probe team reported that he had amassed a small following in Oregon, mostly consisting of mercenaries. After a brief firefight between Central forces and bandits, John Doe was caught and imprisoned alongside other petty warlords. The guards noted that he was already an ancient man then, likely in his 80's. No fingerprints could be taken due to his prosthetic hands and the prison was abandoned before further studies could take place. John Doe left and slipped into obscurity.\n\nIt was not until 2161 that John Doe resurfaced, this time at the head of a small army of fanatics. His face had become obscured by an esoteric mask and few knew of his real identity. When Central initiated the Northern campaign in 2166, John Doe was one among many of the petty warlords who resisted their advance. But the years dragged on and petty settlements fell. Eventually, John Doe's realm, once stretching from the Pacific to the Rockies, was reduced to small hideouts near the coast.\n\nJohn Doe's followers are almost as elusive as the man himself, but a few captured initiatives have spoken of mystifying things: John Doe and his close circle of "Chrysalids", or local elites, are searching for the cure to aging. Myths speak of the man's true identity and one can only wonder what his ancient eyes have seen... and what lies behind that iron mask."
#SIL_enkidu: "Enkidu"
#SIL_phoenix: "Phoenix"
#SIL_draugr: "Draugr"
SIT_spencer_morgan: "Spencer Morgan"
SIT_spencer_morgan_desc: "Spencer Morgan began his career as an enlistee in the Central army during the early days of the 3rd Civil War. He distinguished himself by leading the famous Littletown Raid, in which he, a dozen footmen and a decrepit walker managed to break through warlord defenses and occupy Littletown, a major stronghold in the Rocky Mountains. This victory pathed the way for Central domination over transportation in the mountain ranges, allowing it to operate across multiple fronts at lightning speeds. Major Morgan went on to participate in critical clashes in California and garnered much fame for his argument against the utilization of nuclear weapons against warlords there. Eventually a colonel and then a general, Spencer Morgan finished his military career at the age of 32 when he successfully pacified the warlord Dangerman in the Midwest.\n\nFor his service, General Morgan was granted authority over District 7. Exchanging the sword for the pen, Morgan proved himself a capable administrator and negotiator. He signed treaties with the local tribes and gangs, bringing much needed order to District 7. His rule saw the creation of entire cities, the resettlement of abandoned lands, and the establishment of a culture fluent in politics. Now an old man, General Morgan has mostly withdrawn from the public sphere. He spends his days secluded in his forest cabin, which has allowed bandits to resurface on the periphery. His supporters have begun to forget the man's contributions and some wonder just how strong his grip over District 7 really is."
SOV_vadim_kozlov: "Vadim Kozlov"
SOV_vadim_kozlov_desc: "The most celebrated cosmonaut since Yuri Gagarin, Vadim Kozlov came from a working-class family but rose to heroic stature in the years following the Dark Ages.\n\nEldest son of parents who labored as itinerant steelworkers and welders, Vadim acquired his limited formal education in industrial cities scattered across the Federation. Inducted into the armed forces and immediately given the rank of Colonel, Vadim took advantage of part-time educational programs to gain a comp-diploma in aerospace engineering. Over the next decade, he became the public face of the Federation efforts to exploit the vast resources of space.\n\nIncredibly popular among the working class, a devoted family man, and fiercely loyal to the Slavic state that had rewarded his hard work, Kozlov eschewed offers to enter politics or move into the civilian realm. Vadim Kozlov is the founder of the Slavic Federation, which he sees as a necessary step towards human progress."
TRE_arc_oversight_board: "Oversight Board"
TRE_arc_oversight_board_desc: "The ARC Oversight Board is a ruling council composed of 20 members, 18 of whom are direct corporate representatives from ARC itself. Assigned to the District with the stated goal of maintaining order and reviving civilization, the Board's members have elected to build up their strength by going on vacations and purchasing the newest augmentations. ARC would do something about this insubordination, but is too preoccupied with global concerns. The Board controls the only organized military force in the District, the 68th and 45th ARC Peacekeeping Divisions.\n\nWhile opposed at nearly every opportunity by local interest groups and the United Nations), the Oversight Board's power is near total. The Board commands full respect in the cities by controlling their water flow and ration intakes. While dissent is theoretically meant to be dealt with swiftly, the Board has been accused of neglecting its duties and allowing the raiders to grow out of control."
TUR_emre_yilmaz: "Emre Yilmaz"
TZN_jama_samatar: "Jama Samatar"
TZN_jama_samatar_desc: "Avuncular, genial, affable, affecting an air of bonhomie, Jama Samatar wished to be addressed as Kubwa Mjomba - "great uncle" in Swahili - by those he both commanded and protected. Despite his seeming benevolence and absent-minded demeanor, he was nonetheless an efficient and effective administrator, an able diplomat, and ruthless (when necessary). Samatar was amused and likely pleased when detractors likened him to the traditional African village chieftains of the past, claiming him to be a throwback and out-of-step with the new world in the wake of the Great Mistake.\n\nRising from the poverty and violence of the inundated streets of Hargeisa, Samatar joined the African Union's resurgent military forces, eventually rising to the rank of Major. For three decades he served in a variety of increasingly important posts, military and civilian, rising steadily in both ability and influence. He was able to overcome lingering tribal tensions, dealing with the polyglot cultures of Africa with both reverence and common sense. Jama Samatar proved to be just as efficient against any perceived threat to the well-being and safety of those under his protection. In dealing with nascent warlords, religious fanatics, and local dictators, he either brought about an equitable peace, or bludgeoned them into submission. Although never known as a military genius, his troops were extremely loyal to their "great uncle" and fought with abandon for his approval. Samatar never lost a battle, although he took no credit for his victories and viewed them as lamentable necessities. Though not religious himself, he has been tolerant and accepting of others' religious traditions."
URA_liev_ganin: "Liev Ganin"
URA_liev_ganin_desc: "Liev Ganin never understood warfare in a technical sense. Having cheated his way through the Suvorov Military Academy, he found himself armed and sent into the meatgrinder of Central Asia. The campaign dragged on for many years, claiming all of Liev's friends.\n\nThe Great Rout came at the climax of of the campaign in 2157, by which point Liev's skill for improvisation and limited tactical expertise had landed him the undesirable position of general. Following the migration of Army Group South into the Urals, Liev settled in the mountain chain, drinking his sorrows away. However, either semi-consciously or through gritted teeth, Liev Ganin is digging up old hatchets."
USA_ulrik_svensgaard: "Ulrik Svensgaard"
USA_ulrik_svensgaard_purity_desc: "Ulrik Svensgaard was born in 2158, to a Newfoundland fisherman father, and a Massachusetts expat-descended barkeep mother. He spent his early 20s following in his father's footsteps before he suddenly joined the Federal Navy in 2176, causing a rift with his family that was never repaired. He served with distinction in naval patrols against Atlantic ocean piracy, earning himself a berth at OCS and an eventual appointment as navigator with the David Cameron Sears battle group.\n\nDuring the disastrous 2187 Battle of Baffin Bay, Svensgaard single-handedly rescued Flag Admiral Clarke and three other senior officers trapped below decks when the Sears' magazine exploded, costing Svensgaard the use of his left eye. For his heroics, he was offered his choice of assignments; when Svensgaard facetiously asked to be made President (claiming his leadership wouldn't have led to the Federal navy sailing bow-first into a massacre), he was shocked to find himself nominated as the candidate for the Republican-Democrat Coalition, effectively guaranteeing his election. Although such a state of affairs was mostly indicative of the Federal government's desperation following the 2084 Siege of Washington, it would be a mistake to deny how Svensgaard's own strengths as a leader would fit his newfound role.\n\nSvensgaard has the rugged determination and self-reliance of a man who has repeatedly conquered the elements on his own terms. He can be sensitive to his lowly origins, and seems to take pleasure in humbling those who believe they possess more impressive pedigrees or credentials. He is supremely self-confident, but he is unfailingly polite to his associates and follows a kind of chivalric code even with his enemies - assuming said enemies are ones he deems worthy of said chivalry, that is. He never seeks a fight that someone else didn't start and if he gives his word, it is good as a bond."
USA_ulrik_svensgaard_divinity_desc: "When it came time to ask if weapons are more important than the world itself, Svensgaard surprisingly felt a soft spot for the wide-eyed kids who said they could make the very oceans something worth swimming in again. Perhaps it was because they were down in the dirt and mud where most Republicans wouldn't dare get their sleeves scuffed, maybe it was because he wasn't willing to give the brass any more pull than they already had, but Svensgaard has decided that the new America would be a greener America. His new Democratic allies have promised him to make sure his forces will be at the top of their game; when it comes to reclaiming America, they'll have to be!"
USA_ulrik_svensgaard_mastery_desc: "When it came time to choose between faith and firepower, Svensgaard has chosen Republican weapons tech over Democratic preaching. Having told the tree-huggers to take a vacation at INTEGR's Germany, Svensgaard is now flush with technicians, entrepreneurs, and more officers than you can shake a stick at. Though there are times where he is irritated at their preening, and misses the days where every man personally held the trigger they were firing, Svensgaard does have to admit that robotic soldiers can compensate for the Federal government's woefully small population. He just hopes he didn't put all his eggs into a soon-to-be-recalled basket."
