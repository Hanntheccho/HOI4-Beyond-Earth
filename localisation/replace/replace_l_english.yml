train_equipment: "Maglev Equipment"
train_equipment_desc: "Maglev equipment is the technology used in magnetic levitation trains, which includes the tracks, guidance systems, power systems, and control systems needed to operate the trains.\n\nIt is a fast, smooth, and efficient transportation solution with reduced noise and vibration and offers several advantages over traditional rail systems."
motorized_equipment: "Crawler Equipment"
motorized_equipment_desc: "Crawler equipment uses tracks or treads instead of wheels to move over rough terrain, providing greater stability and mobility in challenging environments. It includes machinery such as bulldozers, excavators, and cranes, and is essential for many industries.\n\nCrawler equipment continues to evolve, offering new possibilities with advancements in materials, automation, and energy efficiency."
