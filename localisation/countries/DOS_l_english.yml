###############################
###### NATIONAL SPIRITS #######
###############################

DOS_to_the_coast: "To the Coast!"
DOS_to_the_coast_desc: "District 2 has been fighting the subversive Chrysalids for some time now. As the last remnants of pre-war warlords, the enigmatic Silk Path has continued to be a thorn in the side of both Central and ARC. District 2's officers are tasked with cleansing the District of the subversives… but may have other plans waiting in store."
DOS_divided_leadership: "Divided Leadership"
DOS_divided_leadership_desc: "This District is ruled by two organizations simultaneously.\n\nThe first is the ARC Delegation, led by Vice President Anthony Beaton of Reclamation Cascadia. Although far away from home, this clique has managed to secure a support base among the District's affluent citizenry. Due to its mountainous nature, old Cascadia has escaped the worst of the Great Mistake, which has allowed it to keep a sizable middle class, which is all too eager to support Beaton's promises of extended life.\n\nThe other faction, led by Relief Officer Haven Barnett, is the Central Delegation. While it draws popular backing from the poorer Southern parts, it has roots in the upper classes as well. Though less radical than her ARC counterpart, Barnett also seeks the elusive goal of extended life.\n\nFor now, the two factions are united in the struggle against the Western warlord. But as victory draws closer, the cracks deeper, and the whole structure can come crashing down..."
