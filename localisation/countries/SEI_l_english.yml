###############################
###### NATIONAL SPIRITS #######
###############################

SEI_the_migration_problem: "The Migration Problem"
SEI_the_migration_problem_desc: "The local population of this District is in a constant state of flux. Refugees from old Louisiana still inhabit the Eastern coast, but regularly undergo famine as the fishing industry declines. Meanwhile, bandits and tribes from Mexico travel Northwards annually in search of more suitable climates. The recent uprising in Southern Mexico has further fueled this migration, and thousands are making their way through the border. This issue is continually destabilizing District 6 and will lend much political capital to whoever manages to resolve it."
SEI_political_battleground: "Political Battleground"
SEI_political_battleground_desc: "District 6 is currently divided between ARC and Central loyalists. The former, led by Vice President Suzane Fielding herself, consists primarily of middle-class supporters and those who stand to benefit by extensive reclamation projects along the Eastern coast. On the other end, Central loyalists are led by Axton Barron, the former representative of District 6 before his ostracization from politics in the 80s. Now, having recovered much of his political capital, Barron has returned to re-secure old Texas in the name of Central. His support is primarily drawn from rich elites and power brokers who have a vested interest in attaining Central relief aid."
