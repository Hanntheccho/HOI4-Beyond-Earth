###### NATIONAL SPIRITS #######
###############################

SIT_battle_of_the_purists: "Battle of the Purists"
SIT_battle_of_the_purists_desc: "District 7 is undergoing a war, an invisible war, a war in the minds. As the Midwest was relatively unaffected by the Great Mistake, and was too large to fully experience the scars of the Civil Wars and anarchy, its local population has achieved a level of prosperity rarely seen on the continent. This has given way to a noticeable middle and upper class. Even the poorer folks can live in peace, without fear of bandit attacks or famines. This semblance of the old world order has manifested itself in a somewhat politicized populace.\n\nCurrently, the two main competitors for the District's influence are Spencer Morgan, the old general and master administrator who conquered the Midwest during the 3rd American Civil War and saw it prosper, and the alleged usurper, the ARC representative Jensen Laneman. Both men believe in the past, a better past. But as their supporters fight brawls and make large promises, the gap between the two ideologies grows larger. It is inevitable that some major political upset will happen in the near future - the only question is who will come out on top."
SIT_economic_security: "Economic Security"
SIT_economic_security_desc: "Surprisingly, this District is experiencing economic prosperity. Local businesses are flourishing despite the local government's tight grip on the market, and the computer-assisted administration has made strides in optimizing factories and the agricultural sector."

###############################
########## CHARACTERS #########
###############################

#POLITICS_STEPHEN_QUARITCH_DESC: "The amount currently known about Stephen Quaritch by the Central government is next to nothing. The only things they know for certain is that he is really good at killing, really good at turning other people into killers, and that his position as the ARC Chief Security Officer all but makes him immune to prosecution, no matter who he or his “soldiers” kill. There are a multitude of theories in regards to his backstory, ranging from being a warlord the ARC hired rather than defeat in combat, to being a former member of the runt Naval Junta in Newfoundland. It is almost certain that the ARC has concealed most of Quaritch's background, most likely including his name; although Spencer Morgan attempted to uncover the truth of Quaritch, the latter's takeover of District 7 has undone all the progress into the investigation. If the truth about Quaritch will be revealed, it is clear it will be on his own terms, at the time he chooses..."
