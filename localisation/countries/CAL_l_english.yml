CAL_spartan_federation: "The Spartan Federation"
CAL_spartan_federation_desc: "Born from the ashes of nuclear fire, the Spartan Federation is a nation focused on martial discipline. Its principal self-declared duty is to fill the holes left by the million bullets fired in years of artificial conflict, which they claim is the product of a lack of honor and proudness in American society."
