###### NATIONAL SPIRITS #######
###############################

ONE_land_of_the_free: "Land of the Free"
ONE_land_of_the_free_desc: "The provinces once known as "California" are fried. Just like its East Coast counterpart, the land is heavily flooded and has a bloody history of anarchy. The few who remain live their lives as raiders, pillaging long-abandoned homes and farms in a never-ending search for food. Scars from meltdowns and chemical warfare still plague the air."
ONE_central_aid_high: "Central Aid: §GVery High§!"
ONE_central_aid_high_desc: "This District is receiving supplies and developmental aid from Central. While these resources are but scraps off an already tiny plate, the survivors are ready to do anything to get some fresh meat or more ammo."
