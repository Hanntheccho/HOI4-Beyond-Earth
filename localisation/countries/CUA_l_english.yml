CUA_war_on_the_future: "War on the Future"
CUA_war_on_the_future_desc: "This District is defined by its struggle against overwhelming technological progress. Beset on all sides by foreign concepts such as "augmentation", "artificial intelligence", and "space colonization". This will not do.\n\nMiriam Godwinson, her clique of supporters, and former Central overseers form a high council bent on keeping the District safe at any cost. If that means banning augmentation technology, forcing society to exist on a semi-modernized level, or keeping unholy technology at bay, so be it. Preachers of many faiths travel the South's streets, spreading word of the dangers or unbridled progress."
